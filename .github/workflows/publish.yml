# publish.yml -- tells GitHub to rebuild and publish the page automatically.
# Every time you save ("commit") a change to the main branch, GitHub will:
#   1) install Quarto, 2) turn index.qmd into index.html, 3) publish the result.
# You never have to build index.html yourself.

name: Publish guide

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the files
        uses: actions/checkout@v4

      - name: Install Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Build the page
        run: quarto render index.qmd

      - name: Collect the files to publish
        run: |
          mkdir _site
          cp index.html _site/
          cp *.pdf _site/ 2>/dev/null || true

      - name: Package the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
